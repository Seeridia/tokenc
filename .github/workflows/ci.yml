name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.13
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Verify public package versions
        run: vp run check:versions

      - name: Run static checks
        run: vp check

      - name: Build packages and example
        run: vp run -r build

      - name: Verify public contracts
        run: vp run check:contracts

      - name: Run tests
        run: vp test --run

      - name: Enforce stable M1 performance budgets
        run: vp run bench:gate

      - name: Enforce stable M2 performance budgets
        run: vp run bench:m2:gate

      - name: Verify packed release candidate
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/tokenc-release
        run: |
          vp run verify-release \
            --phase packed \
            --tag latest \
            --commit "${{ github.sha }}" \
            --output "$RELEASE_OUTPUT"

      - name: Verify checks leave the worktree clean
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "CI generated or modified files outside ignored output directories:"
            git status --short
            exit 1
          fi

  vscode-extension:
    name: VS Code VSIX smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: 22.13
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Package, install, and exercise the VSIX
        env:
          TOKENC_VSCODE_VERSION: 1.134.0
        run: xvfb-run -a vp -C packages/vscode-extension run smoke:vsix

      - name: Retain deterministic VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tokenc-vscode-vsix
          path: artifacts/tokenc-vscode.vsix
          if-no-files-found: error
          retention-days: 14

      - name: Verify checks leave the worktree clean
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "VSIX verification modified tracked files:"
            git status --short
            exit 1
          fi
