name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.13
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Verify public package versions
        run: vp run check:versions

      - name: Run static checks
        run: vp check

      - name: Build packages and example
        run: vp run -r build

      - name: Run tests
        run: vp test --run

      - name: Verify packed release candidate
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/tokenc-release
        run: |
          vp run verify-release \
            --phase packed \
            --tag latest \
            --commit "${{ github.sha }}" \
            --output "$RELEASE_OUTPUT"

      - name: Verify checks leave the worktree clean
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "CI generated or modified files outside ignored output directories:"
            git status --short
            exit 1
          fi
