name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta

concurrency:
  group: npm-publish

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: 24
          cache: true
          registry-url: https://registry.npmjs.org
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run release checks
        run: |
          vp check
          vp run -r build
          vp test --run

      - name: Publish packages
        run: vp run publish-packages --tag "${{ inputs.npm_tag }}"

      - name: Push release tags
        run: vp exec changeset tag && git push --follow-tags
