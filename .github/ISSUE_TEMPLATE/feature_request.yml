name: Feature request
description: Propose a compiler, backend, or developer-experience improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the design-token workflow or limitation this proposal addresses.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired API or behavior and which compiler stage owns it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Architecture check
      options:
        - label: This proposal preserves the separation between compiler core, CLI, and backends.
          required: true
