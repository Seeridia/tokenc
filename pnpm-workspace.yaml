packages:
  - packages/*
  - examples/*

allowBuilds:
  "@vscode/vsce-sign": false
  esbuild: true
  keytar: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vitest: 4.1.11
  vite-plus: 0.2.9
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
